<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- База: тёмно-синий с уходом в чёрный к низу -->
    <linearGradient id="base" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#18222F"/>
      <stop offset="0.6" stop-color="#121A25"/>
      <stop offset="1" stop-color="#0C121B"/>
    </linearGradient>
    <!-- Золото: светлее сверху, гуще к низу -->
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F2C75F"/>
      <stop offset="0.45" stop-color="#E3A72F"/>
      <stop offset="1" stop-color="#B77F1C"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B443"/>
      <stop offset="1" stop-color="#A9741A"/>
    </linearGradient>
  </defs>

  <rect width="320" height="620" fill="url(#base)"/>

  <!-- Тень под лучами: без неё золото выглядит наклейкой -->
  <polygon points="392,40 196,620 138,620" fill="#080D14" opacity="0.8"/>

  <!-- Лучи из точки за правым краем: широкий, средний, тонкий.
       Все держатся правой стороны — слева идут названия разделов -->
  <polygon points="392,40 300,620 232,620" fill="url(#gold)"/>
  <polygon points="392,40 226,620 192,620" fill="url(#goldSoft)"/>
  <polygon points="392,40 186,620 168,620" fill="url(#gold)" opacity="0.85"/>

  <!-- Блик по краю широкого луча -->
  <polygon points="392,40 297,620 279,620" fill="#F8D882" opacity="0.3"/>
</svg>
